name: m15-bot

on:
  schedule:
    - cron: "*/15 * * * *"      # every 15 minutes; GitHub may delay a run, the bot catches up on every closed bar
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: m15-bot
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 12          # 19 coins x 75 days of 15m candles; fail fast if Coinbase hangs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pandas numpy
      - name: Run one tick
        run: python bot.py --once
      - name: Save state back to the repo
        run: |
          git config user.name  "m15-bot"
          git config user.email "m15-bot@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "state: $(date -u +%FT%TZ)"
          git push
